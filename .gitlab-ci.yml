# Pipeline definition for fifa-card-generator (frontend-only Angular SPA).
# Canonical template at atomstudios/ci-template/pipelines/frontend-only.yml.

include:
  - project: 'atomstudios/ci-template'
    ref: main
    file: '/pipelines/frontend-only.yml'

variables:
  APP_NAME: fifa-card-generator
  APP_DEPLOYMENT: fifa-card-generator-web
  APP_FRONTEND_URL: https://fifa-card-generator.atomstudios.fr
  # fifa-card-generator pushes to ${CI_REGISTRY_IMAGE} directly with no
  # /suffix sub-repo.
  APP_IMAGE_NO_SUFFIX: "true"
  APP_NPM_DIR: "."
  # fifa-card-generator uses `npm run build:prod` as its test gate (no
  # prettier config in the repo).
  APP_TEST_GATE: "build"

# Re-name the lint-frontend job to build-frontend-check, matching the
# semantic of `npm run build:prod`. The hidden template is the same.
build-frontend-check: { extends: .lint_frontend }

build:
  extends: .build_web
  needs: [build-frontend-check]
  variables:
    DOCKERFILE: Dockerfile
    BUILD_CONTEXT: "."

deploy: { extends: .deploy_web }
verify: { extends: .verify }
