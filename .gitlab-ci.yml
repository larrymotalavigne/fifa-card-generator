stages:
  - test
  - build
  - deploy
  - verify

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  GIT_DEPTH: "1"

default:
  interruptible: false
  tags: [ci-docker]

# ─── Shared Templates ──────────────────────────────────────────────────────────

.ssh_setup:
  # Use the LAN IP — public hostname doesn't route from in-cluster runners.
  # ODIN_SSH_KEY/USER/HOST/LAN_IP are inherited from the atomstudios group.
  image: alpine:3.23
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$ODIN_SSH_KEY" ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
    - export ODIN_HOST="${ODIN_SSH_LAN_IP:-192.168.10.111}"
    - echo "Using ODIN_HOST=$ODIN_HOST (user=$ODIN_SSH_USER)"
    - ssh-keyscan -H -T 5 "$ODIN_HOST" > ~/.ssh/known_hosts 2>/dev/null || true
    - chmod 644 ~/.ssh/known_hosts || true
    - |
      cat > /tmp/odin <<'SHELL'
      #!/bin/sh
      exec ssh -i "$HOME/.ssh/id_rsa" \
        -o StrictHostKeyChecking=no \
        -o UserKnownHostsFile=/dev/null \
        -o LogLevel=ERROR \
        -o ConnectTimeout=10 \
        "$ODIN_SSH_USER@$ODIN_HOST" "$@"
      SHELL
    - chmod +x /tmp/odin
    - export PATH=/tmp:$PATH

.docker_build:
  stage: build
  image: docker:29
  tags: [b650-docker]
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker buildx create --name ci-builder --driver docker-container --use 2>/dev/null || docker buildx use ci-builder
    - docker buildx inspect --bootstrap
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

.npm_cache:
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull-push

# ─── Test ──────────────────────────────────────────────────────────────────────

build-frontend-check:
  stage: test
  image: node:24-alpine
  interruptible: true
  extends: .npm_cache
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  before_script:
    - npm config set legacy-peer-deps true
    - npm ci
  script:
    - npm run build:prod
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

security-scan:
  stage: test
  image:
    name: aquasec/trivy:0.69.3
    entrypoint: [""]
  interruptible: true
  script:
    - trivy fs --format table --exit-code 0 --severity HIGH,CRITICAL . | tee trivy-results.txt
  artifacts:
    when: always
    paths:
      - trivy-results.txt
    expire_in: 30 days
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

# ─── Build ─────────────────────────────────────────────────────────────────────

build:
  extends: .docker_build
  needs: [build-frontend-check]
  script:
    - |
      docker buildx build --platform linux/amd64 \
        --cache-from "type=registry,ref=${CI_REGISTRY_IMAGE}:cache" \
        --cache-to "type=registry,ref=${CI_REGISTRY_IMAGE}:cache,mode=max" \
        --tag "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}" \
        --tag "${CI_REGISTRY_IMAGE}:latest" \
        --push .

# ─── Deploy ────────────────────────────────────────────────────────────────────

deploy:
  stage: deploy
  extends: .ssh_setup
  tags: [k3s]
  needs: [build]
  environment:
    name: production
    url: https://fifa-card-generator.atomstudios.fr
  resource_group: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - |
      odin bash <<'EOF'
        set -e
        sudo kubectl rollout restart deployment/fifa-card-generator-web -n apps
        sudo kubectl rollout status deployment/fifa-card-generator-web -n apps --timeout=120s
      EOF

# ─── Verify ────────────────────────────────────────────────────────────────────

verify:
  stage: verify
  image: alpine:3.23
  needs: [deploy]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - apk add --no-cache curl
    - curl -f -s --retry 5 --retry-delay 10 --retry-all-errors https://fifa-card-generator.atomstudios.fr/ > /dev/null && echo "OK"
